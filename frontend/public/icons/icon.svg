<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#10b981" rx="64"/>

  <!-- Activity Monitor Icon -->
  <g transform="translate(256, 256)">
    <!-- Pulse line -->
    <path d="M-180,0 L-120,0 L-80,-80 L-40,80 L20,-40 L60,0 L180,0"
          stroke="white"
          stroke-width="24"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Government Building Icon -->
  <g transform="translate(256, 100)">
    <rect x="-60" y="0" width="120" height="20" fill="white"/>
    <rect x="-50" y="20" width="25" height="60" fill="white"/>
    <rect x="-15" y="20" width="30" height="60" fill="white"/>
    <rect x="25" y="20" width="25" height="60" fill="white"/>
    <rect x="-70" y="80" width="140" height="12" fill="white"/>
  </g>
</svg>
