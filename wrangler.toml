name = "govmonitor-worker"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Worker configuration
workers_dev = true

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "govmonitor-db"
database_id = "30131266-de64-48fe-a8b5-4f3472a93c92"

# KV namespace for fast status lookups
[[kv_namespaces]]
binding = "KV"
id = "d09e53df3b1a4d88a68d7af10e760e87"

# R2 bucket for screenshot uploads
# Enable R2 in Cloudflare Dashboard first, then uncomment:
# [[r2_buckets]]
# binding = "SCREENSHOTS"
# bucket_name = "govmonitor-screenshots"

# Cron triggers for uptime checks
# Multiple intervals to support flexible checking
[triggers]
crons = [
    "*/5 * * * *",  # Every 5 minutes
    "*/10 * * * *", # Every 10 minutes
    "*/15 * * * *", # Every 15 minutes
    "*/30 * * * *", # Every 30 minutes
    "0 * * * *"     # Every 60 minutes
]

# Environment variables
[vars]
ENVIRONMENT = "production"
USER_AGENT = "GovMonitorBot/1.0 (+https://govmonitor.org)"
TIMEOUT_MS = "15000"
MAX_LATENCY_MS = "10000"

# Authentication configuration
REQUIRE_AUTH_FOR_READS = "false"  # Set to "true" to require auth for GET requests

# Secrets (set via: wrangler secret put SECRET_NAME)
# These are NOT stored in this file - use wrangler CLI to set them:
#
# Primary API key (for general administrative access):
#   wrangler secret put API_KEY
#
# Admin API keys (comma-separated, for key management):
#   wrangler secret put ADMIN_API_KEYS
#
# Read-only API keys (comma-separated, for monitoring access):
#   wrangler secret put READ_ONLY_API_KEYS
#
# Google OAuth credentials (for user authentication):
#   wrangler secret put GOOGLE_CLIENT_ID
#   wrangler secret put GOOGLE_CLIENT_SECRET
#
# Example usage:
#   curl -H "Authorization: Bearer YOUR_API_KEY" https://api.govmonitor.org/api/targets

# Build configuration
[build]
command = "npm install && npm run build"
